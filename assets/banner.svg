<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">mcp-after-effects</title>
  <desc id="d">Chat with Claude, animate in After Effects. A timeline with eased keyframes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b1e"/>
      <stop offset="0.55" stop-color="#14123a"/>
      <stop offset="1" stop-color="#231552"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b6cff"/>
      <stop offset="0.5" stop-color="#b48cff"/>
      <stop offset="1" stop-color="#ff8fd8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#9a7bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9a7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- Speed graph: an ease-in / ease-out curve with keyframes -->
  <g transform="translate(660 70)">
    <path d="M0 230 H560" stroke="#ffffff" stroke-opacity="0.12"/>
    <path d="M0 230 C 190 230, 200 20, 280 20 S 380 230, 560 230" fill="none" stroke="url(#curve)" stroke-width="5" stroke-linecap="round"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-dasharray="4 6">
      <path d="M0 230 L190 230"/>
      <path d="M560 230 L370 230"/>
      <path d="M200 20 L360 20"/>
    </g>
    <g fill="#ffffff">
      <circle cx="190" cy="230" r="5"/>
      <circle cx="370" cy="230" r="5"/>
      <circle cx="200" cy="20" r="5"/>
      <circle cx="360" cy="20" r="5"/>
    </g>
    <!-- timeline ruler -->
    <g stroke="#ffffff" stroke-opacity="0.25">
      <path d="M0 290 H560"/>
      <path d="M0 284 V296 M70 287 V293 M140 284 V296 M210 287 V293 M280 284 V296 M350 287 V293 M420 284 V296 M490 287 V293 M560 284 V296"/>
    </g>
    <g fill="#ffd166">
      <path d="M0 278 l12 12 -12 12 -12 -12z"/>
      <path d="M280 278 l12 12 -12 12 -12 -12z"/>
      <path d="M560 278 l12 12 -12 12 -12 -12z"/>
    </g>
    <path d="M280 -10 V310" stroke="#4dd0ff" stroke-width="2"/>
    <path d="M272 -14 h16 v10 l-8 8 -8 -8z" fill="#4dd0ff"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="80" y="150" fill="#b9b4ff" font-size="22" font-weight="600" letter-spacing="4">MODEL CONTEXT PROTOCOL</text>
    <text x="78" y="222" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="-1">After Effects</text>
    <text x="80" y="268" fill="#d8d4ff" font-size="24" font-weight="400">Chat with Claude. Animate in After Effects.</text>
    <g transform="translate(80 300)">
      <rect width="148" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="74" y="23" fill="#ffffff" font-size="15" text-anchor="middle">Kinetic text</text>
      <rect x="160" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="235" y="23" fill="#ffffff" font-size="15" text-anchor="middle">PSD → motion</text>
      <rect x="322" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="397" y="23" fill="#ffffff" font-size="15" text-anchor="middle">Speed ramps</text>
    </g>
  </g>
</svg>
